# Custom integrations have no official tier; this tracks the Bronze rules as a guide.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The integration does not poll anything.
  brands: done
  common-modules:
    status: exempt
    comment: No coordinator or base entity; the integration provides no entities.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration has no Python requirements.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The integration provides no entities.
  entity-unique-id:
    status: exempt
    comment: The integration provides no entities.
  has-entity-name:
    status: exempt
    comment: The integration provides no entities.
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: There is no connection to test; notes are stored locally.
  test-before-setup:
    status: exempt
    comment: Setup only loads local storage; there is no device or service to connect to.
  unique-config-entry: done
